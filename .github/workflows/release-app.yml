name: Release App + HUD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Coexists with release-cli.yml (also on "v*"): each release workflow
      # only proceeds for the tag that matches ITS package version, and
      # green-skips every other tag instead of failing the run.
      - name: Match tag to app version
        id: match
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "v${VERSION}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${GITHUB_REF_NAME} does not match app version v${VERSION}; skipping app+HUD release."
          fi

      - name: Install dependencies
        if: steps.match.outputs.ok == 'true'
        run: npm install --no-audit --no-fund

      - name: Build HUD download bundle
        if: steps.match.outputs.ok == 'true'
        run: node scripts/build-hud-package.mjs

      - name: Pack HUD package
        if: steps.match.outputs.ok == 'true'
        working-directory: packages/9router-hud
        run: npm pack --ignore-scripts --pack-destination "${GITHUB_WORKSPACE}"

      - name: Pack app tarball
        if: steps.match.outputs.ok == 'true'
        run: npm pack --ignore-scripts --pack-destination "${GITHUB_WORKSPACE}"

      - name: Verify packages + checksums
        if: steps.match.outputs.ok == 'true'
        run: |
          VERSION="${{ steps.match.outputs.version }}"
          HUD_VERSION=$(node -p "require('./packages/9router-hud/package.json').version")
          APP_TGZ="9router-app-${VERSION}.tgz"
          HUD_TGZ="9router-hud-${HUD_VERSION}.tgz"
          test -f "${APP_TGZ}"
          test -f "${HUD_TGZ}"
          tar -xOf "${APP_TGZ}" package/package.json | grep -q '"name": "9router-app"'
          tar -xOf "${HUD_TGZ}" package/package.json | grep -q '"name": "9router-hud"'
          sha256sum "${APP_TGZ}" > "${APP_TGZ}.sha256"
          sha256sum "${HUD_TGZ}" > "${HUD_TGZ}.sha256"
          cat "${APP_TGZ}.sha256" "${HUD_TGZ}.sha256"

      - name: Upload build artifacts
        if: steps.match.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 9router-app-${{ github.ref_name }}
          path: |
            9router-app-*.tgz
            9router-app-*.tgz.sha256
            9router-hud-*.tgz
            9router-hud-*.tgz.sha256

      - name: Create GitHub release
        if: steps.match.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.match.outputs.version }}"
          HUD_VERSION=$(node -p "require('./packages/9router-hud/package.json').version")
          APP_TGZ="9router-app-${VERSION}.tgz"
          HUD_TGZ="9router-hud-${HUD_VERSION}.tgz"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${APP_TGZ}" "${APP_TGZ}.sha256" \
              "${HUD_TGZ}" "${HUD_TGZ}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${APP_TGZ}" "${APP_TGZ}.sha256" \
              "${HUD_TGZ}" "${HUD_TGZ}.sha256" \
              --title "9Router ${VERSION}" --generate-notes
          fi
