name: Release CLI Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Coexists with release-app.yml (also on "v*"): each release workflow
      # only proceeds for the tag that matches ITS package version, and
      # green-skips every other tag instead of failing the run.
      - name: Match tag to CLI version
        id: match
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          if [ "${GITHUB_REF_NAME}" = "v${VERSION}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${GITHUB_REF_NAME} does not match CLI version v${VERSION}; skipping CLI release."
          fi

      - name: Install dependencies
        if: steps.match.outputs.ok == 'true'
        run: |
          npm install --no-audit --no-fund
          npm --prefix cli install --ignore-scripts --no-audit --no-fund

      - name: Build CLI package
        if: steps.match.outputs.ok == 'true'
        run: npm run cli:pack

      - name: Verify package
        if: steps.match.outputs.ok == 'true'
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          PACKAGE="9router-${VERSION}.tgz"
          test -f "${PACKAGE}"
          tar -xOf "${PACKAGE}" package/package.json | grep -q '"9router": "./cli.js"'
          PREFIX=$(mktemp -d)
          npm install -g --prefix "${PREFIX}" "./${PACKAGE}" --ignore-scripts --no-audit --no-fund
          test -L "${PREFIX}/bin/9router"
          sha256sum "${PACKAGE}" > "${PACKAGE}.sha256"

      - uses: actions/upload-artifact@v4
        if: steps.match.outputs.ok == 'true'
        with:
          name: 9router-cli-${{ github.ref_name }}
          path: |
            9router-*.tgz
            9router-*.tgz.sha256

      - name: Create GitHub release
        if: steps.match.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          PACKAGE="9router-${VERSION}.tgz"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${PACKAGE}" "${PACKAGE}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${PACKAGE}" "${PACKAGE}.sha256" \
              --title "9Router ${VERSION}" --generate-notes
          fi
